    <script src="/js/dashboard.js"></script>
    <script>
        const userId = new URLSearchParams(window.location.search).get('userId') || localStorage.getItem('userId');
        let isStreaming = false;

let modelChoice = localStorage.getItem('modelChoice') || 'user';

// --- MediaPipe Hands en el navegador ---
let handLandmarker = null;
let videoEl = null;
let overlayCtx = null;
let detectionLoopRunning = false;
let lastPredict = 0;
const PREDICT_INTERVAL = 150; // ms

async function initHandTracker() {
    const visionUrl = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0/wasm';
    const modelPath = 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task';
    const { FilesetResolver, HandLandmarker } = window;
    if (!FilesetResolver || !HandLandmarker) {
        showNotification('Error: MediaPipe no se cargó (revisa tu conexión a internet).');
        return;
    }
    const vision = await FilesetResolver.forVisionTasks(visionUrl);
    try {
        handLandmarker = await HandLandmarker.createFromOptions(vision, {
            baseOptions: { modelAssetPath: modelPath, delegate: 'GPU' },
            runningMode: 'VIDEO',
            numHands: 1
        });
    } catch (e) {
        console.warn('GPU no disponible, usando CPU.', e);
        handLandmarker = await HandLandmarker.createFromOptions(vision, {
            baseOptions: { modelAssetPath: modelPath, delegate: 'CPU' },
            runningMode: 'VIDEO',
            numHands: 1
        });
    }
    console.log('HandLandmarker listo');
}

function coordsDesdeLandmarks(lm) {
    const pts = [];
    for (const p of lm) {
        const z = (p.z != null && !isNaN(p.z)) ? p.z : 0;
        pts.push([p.x, p.y, z]);
    }
    return pts;
}

function normalizarLandmarks(coords) {
    // Misma fórmula que backend/python/gestos_utils.py (_normalizar_puntos)
    const mu = coords[0], base = coords[9];
    const dx = base[0] - mu[0], dy = base[1] - mu[1], dz = base[2] - mu[2];
    const ref = Math.sqrt(dx * dx + dy * dy + dz * dz) || 1e-6;
    const v = [];
    for (const p of coords) { v.push((p[0] - mu[0]) / ref, (p[1] - mu[1]) / ref, (p[2] - mu[2]) / ref); }
    return v;
}

const HAND_CONNECTIONS = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];

function drawLandmarks(coords) {
    if (!overlayCtx) return;
    const cv = overlayCtx.canvas;
    overlayCtx.clearRect(0, 0, cv.width, cv.height);
    if (!coords) return;
    const w = cv.width, h = cv.height;
    const pts = coords.map(p => [p[0] * w, p[1] * h]);
    overlayCtx.strokeStyle = '#0df259';
    overlayCtx.lineWidth = 3;
    for (const [a, b] of HAND_CONNECTIONS) {
        overlayCtx.beginPath();
        overlayCtx.moveTo(pts[a][0], pts[a][1]);
        overlayCtx.lineTo(pts[b][0], pts[b][1]);
        overlayCtx.stroke();
    }
    overlayCtx.fillStyle = '#0df259';
    for (const [x, y] of pts) {
        overlayCtx.beginPath();
        overlayCtx.arc(x, y, 4, 0, Math.PI * 2);
        overlayCtx.fill();
    }
}

function detectLoop() {
    if (!detectionLoopRunning) return;
    if (videoEl && videoEl.readyState >= 2 && handLandmarker) {
        const ahora = performance.now();
        try {
            const res = handLandmarker.detectForVideo(videoEl, ahora);
            if (res.landmarks && res.landmarks.length > 0) {
                const coords = coordsDesdeLandmarks(res.landmarks[0]);
                drawLandmarks(coords);
                if (ahora - lastPredict > PREDICT_INTERVAL) {
                    lastPredict = ahora;
                    fetch('/api/python/predecir', {
                        method: 'POST',
                        headers: authHeaders({ 'Content-Type': 'application/json' }),
                        body: JSON.stringify({ coords })
                    }).catch(() => {});
                }
            } else {
                drawLandmarks(null);
            }
        } catch (e) { /* ignorar errores por frame */ }
    }
    requestAnimationFrame(detectLoop);
}

function selectModel(mode) {
    if (mode === modelChoice) return;
    modelChoice = mode;
    localStorage.setItem('modelChoice', modelChoice);
    updateModelToggle();
    loadModel();
}

function updateModelToggle() {
    const userBtn = document.getElementById('modelUserBtn');
    const baseBtn = document.getElementById('modelBaseBtn');
    if (!userBtn || !baseBtn) return;
    const active = 'px-3 py-1.5 text-xs font-bold rounded-lg transition-colors bg-primary text-white shadow';
    const inactive = 'px-3 py-1.5 text-xs font-bold rounded-lg transition-colors text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-white/10';
    userBtn.className = modelChoice === 'user' ? active : inactive;
    baseBtn.className = modelChoice === 'base' ? active : inactive;
}

function loadModel() {
    if (!userId) return Promise.resolve();
    return fetch(`/api/python/load-model?userId=${userId}&model=${modelChoice}`, { method: 'POST', headers: authHeaders() })
        .then(r => r.json())
        .then(data => {
            if (data.success) {
                showNotification(data.modelLoaded
                    ? 'Modelo listo para reconocer.'
                    : 'Sin modelo propio: se usará el modelo base al pausar el gesto.');
            } else {
                showNotification('Error: ' + (data.message || 'No se pudo cargar el modelo'));
            }
            return data;
        })
        .catch(() => showNotification('No se pudo cargar el modelo.'));
}

function applyCameraAspect() {
    const box = document.getElementById('cameraBox');
    const video = document.getElementById('videoFeed');
    if (!box || !video || !video.videoWidth) return;
    const portrait = video.videoHeight > video.videoWidth;
    box.style.aspectRatio = portrait ? '3 / 4' : '16 / 9';
    box.style.maxHeight = portrait ? '72vh' : '70vh';
}

function startCamera() {
    const video = document.getElementById('videoFeed');
    const canvas = document.getElementById('overlayCanvas');
    if (!video || !canvas) return;
    if (video.srcObject) return;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        showNotification('getUserMedia no soportado por este navegador.');
        return;
    }
    navigator.mediaDevices.getUserMedia({ video: true })
        .then(stream => {
            videoEl = video;
            video.srcObject = stream;
            video.onloadedmetadata = () => {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                overlayCtx = canvas.getContext('2d');
                isStreaming = true;
                detectionLoopRunning = true;
                applyCameraAspect();
                if (!gestureCheckInterval) startGesturePolling();
                requestAnimationFrame(detectLoop);
            };
            showNotification('Cámara lista.');
        })
        .catch(err => {
            console.error('getUserMedia error:', err);
            showNotification('No se pudo acceder a la cámara: ' + (err.message || 'Permiso denegado'));
        });
}

function stopCamera() {
    detectionLoopRunning = false;
    isStreaming = false;
    if (videoEl && videoEl.srcObject) {
        videoEl.srcObject.getTracks().forEach(t => t.stop());
        videoEl.srcObject = null;
    }
    if (overlayCtx) overlayCtx.clearRect(0, 0, overlayCtx.canvas.width, overlayCtx.canvas.height);
}

        function checkAuth() {
            const uid = localStorage.getItem('userId');
            const uname = localStorage.getItem('userName');
            const loginBtn = document.getElementById('loginBtn');
            const userSection = document.getElementById('userSection');
            const nameSpan = document.getElementById('userName');

            if (uid && uname) {
                loginBtn.classList.add('hidden');
                userSection.classList.remove('hidden');
                nameSpan.textContent = uname;
            } else {
                loginBtn.classList.remove('hidden');
                userSection.classList.add('hidden');
            }
        }

        function goHome(){ window.location.href = 'index.html'; }
        function goToLoginPage(){ window.location.href = 'inicio-sesion.html'; }
        function goToDictionary(){ window.location.href = 'diccionario.html'; }
        function goToCapture(){
            const uid = localStorage.getItem('userId');
            if (!uid) {
                showCustomAlert('Inicia sesión para capturar gestos', 'warning');
                setTimeout(()=>window.location.href='inicio-sesion.html',1200);
                return;
            }
            window.location.href = `capture-images.html?userId=${uid}`;
        }
        function goToTranslator(){ window.location.href = 'visualize-model.html'; }
        function logout(){
            serverLogout().then(() => {
                checkAuth();
                showCustomAlert('Sesión cerrada', 'success');
            });
        }

        function showNotification(message) {
            const container = document.getElementById('notificationContainer');
            const notification = document.createElement('div');
            notification.className = 'notification';
            notification.textContent = message;

            container.appendChild(notification);

            // Remove the notification after 3 seconds
            setTimeout(() => {
                container.removeChild(notification);
            }, 3000);
        }

        function updateThemeIcon(){
            const icon = document.getElementById('themeIcon');
            const isDark = document.documentElement.classList.contains('dark');
            icon.textContent = isDark ? 'light_mode' : 'dark_mode';
        }

        function toggleTheme(){
            document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
            updateThemeIcon();
        }

        // Initialize MediaPipe, modelo y cámara del navegador
        document.addEventListener('DOMContentLoaded', () => {
            checkAuth();
            updateThemeIcon();
            updateModelToggle();
            initHandTracker();
            loadModel();
            setTimeout(() => startCamera(), 300);
            window.addEventListener('resize', applyCameraAspect);
            window.addEventListener('orientationchange', () => setTimeout(applyCameraAspect, 300));
        });

// Poll for detected gestures
        let gestureCheckInterval = null;
        let currentGestureTimeout = null;
        
        function startGesturePolling() {
            const gestureDisplay = document.getElementById('gestureDisplay');
            
            gestureCheckInterval = setInterval(() => {
                fetch('/api/python/last-gesture', { headers: authHeaders() })
                    .then(response => response.json())
                    .then(data => {
                        if (data.gesture) {
                            // Update the gesture display
                            gestureDisplay.textContent = 'LETRA: ' + data.gesture;
                        } else {
                            // No gesture detected
                            gestureDisplay.textContent = '-';
                        }
                    })
                    .catch(err => console.warn('Error fetching gesture:', err));
            }, 300); // Poll every 300ms
        }
        
        function stopGesturePolling() {
            if (gestureCheckInterval) {
                clearInterval(gestureCheckInterval);
                gestureCheckInterval = null;
            }
            if (currentGestureTimeout) {
                clearTimeout(currentGestureTimeout);
                currentGestureTimeout = null;
            }
        }

        // Stop cámara y polling al salir de la página
        const closeRecognition = () => {
            stopGesturePolling();
            stopCamera();
        };
        window.addEventListener('beforeunload', closeRecognition);
        window.addEventListener('pagehide', closeRecognition);
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) closeRecognition();
        });

        function stopRecognitionAndNavigate() {
            stopGesturePolling();
            stopCamera();
            window.location.href = 'index.html';
        }
    </script>
