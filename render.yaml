services:
  - type: web
    name: traductor-backend
    runtime: docker
    plan: free
    dockerfilePath: Dockerfile
    envVars:
      # MySQL (Aiven) - configurar credenciales en el panel de Render
      - key: DB_HOST
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: DB_NAME
        value: defaultdb
      - key: DB_PORT
        sync: false
      - key: DB_SSL
        value: "true"
      # JWT
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES
        value: 24h
      # Entorno y CORS
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGINS
        value: https://traductor-backend-hrdf.onrender.com
      # Default user
      - key: USER_ID
        value: "2"
      # URL pública (enlaces de recuperación de contraseña)
      - key: APP_URL
        value: https://traductor-backend-hrdf.onrender.com
      # SMTP para el correo de recuperación. Requerido para que el usuario reciba el
      # enlace por email. Configurar en el panel (sync: false para no mostrarse en el repo).
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      # RESEND (alternativa al SMTP). Con la API key se envía por Resend (dominio verificado en RESEND_FROM).
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      # Destinatario del formulario de contacto/soporte (fallback: SMTP_USER)
      - key: SUPPORT_EMAIL
        sync: false
