services:
  - type: web
    name: traductor-backend
    runtime: docker
    plan: free
    dockerfilePath: Dockerfile
    envVars:
      # MySQL (Aiven) - configurar credenciales en el panel de Render
      - key: DB_HOST
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: DB_NAME
        value: defaultdb
      - key: DB_PORT
        sync: false
      - key: DB_SSL
        value: "true"
      # JWT
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES
        value: 24h
      # Entorno y CORS
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGINS
        value: https://traductor-backend-hrdf.onrender.com
      # Default user
      - key: USER_ID
        value: "2"
